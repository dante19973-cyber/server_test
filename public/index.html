<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Server</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.4rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    button {
      background: #3a7bd5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #00d2ff;
      color: #000;
      transform: translateY(-2px);
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .card h2 {
      margin-bottom: 16px;
      color: #00d2ff;
      font-size: 1.4rem;
    }

    .card pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }

    .section {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .section label {
      display: block;
      margin: 10px 0 6px;
      color: #aaa;
      font-size: 0.9rem;
    }

    .section input,
    .section textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.25);
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .section textarea {
      min-height: 100px;
      resize: vertical;
    }

    .section button {
      margin-top: 14px;
    }

    #output {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(0, 210, 255, 0.12);
      color: #00d2ff;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Local Server</h1>
  <p class="subtitle">Local server with information about me and my city</p>
  <div class="buttons">
    <button onclick="loadData('about')">About me</button>
    <button onclick="loadData('city')">About my city</button>
    <button onclick="loadData('status')">Server status</button>
  </div>
  <div id="result" class="card hidden">
    <h2 id="title"></h2>
    <pre id="resultContent"></pre>
  </div>
  <div class="section">
    <h2>If you want to tell me something</h2>
    <label for="saveFilePath">Name :</label>
    <input type="text" id="saveFilePath" placeholder="example.txt" required>
    <label for="fileContent">Content:</label>
    <textarea id="fileContent" required></textarea>
    <button onclick="saveFile()">Save</button>
    <div id="output"></div>
  </div>
</div>
<script>
  async function loadData(type) {
    const resultDiv = document.getElementById('result');
    const title = document.getElementById('title');
    const content = document.getElementById('resultContent');
    try {
      const response = await fetch(`/api/${type}`);
      const data = await response.json();
      const titles = {
        about: "Information about me",
        city: "Information about my city",
        status: "Server status"
      };
      title.textContent = titles[type];
      content.textContent = JSON.stringify(data, null, 2);
      resultDiv.classList.remove('hidden');
    } catch (err) {
      title.textContent = "Error";
      content.textContent = "Problem with server: " + err.message;
      resultDiv.classList.remove('hidden');
    }
  }
  async function saveFile() {
    const filePath = document.getElementById('saveFilePath').value;
    const content = document.getElementById('fileContent').value;
    const output = document.getElementById('output');
    if (!filePath || !content) {
      output.textContent = 'Error: Please enter a file path and content.';
      output.classList.add('error');
      output.style.display = 'block';
      return;
    }
    try {
      const response = await fetch('/save-file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filePath, content })
      });
      const result = await response.json();
      if (response.ok) {
        output.textContent = result.message;
        output.classList.remove('error');
      } else {
        output.textContent = `error: ${result.error}`;
        output.classList.add('error');
      }
      output.style.display = 'block';
    } catch (err) {
      output.textContent = `Downloading error: ${err.message}`;
      output.classList.add('error');
      output.style.display = 'block';
    }
  }
</script>
</body>
</html>
